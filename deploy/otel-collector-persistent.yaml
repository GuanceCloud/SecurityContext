extensions:
  file_storage/security:
    directory: /var/lib/otelcol/security
    create_directory: true
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
exporters:
  otlphttp/security:
    endpoint: ${env:SECURITY_BACKEND_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:SECURITY_BACKEND_AUTHORIZATION}
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 10000
      storage: file_storage/security
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
service:
  extensions: [file_storage/security]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlphttp/security]
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlphttp/security]
