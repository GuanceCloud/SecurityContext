services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.143.0
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "0:0"
    environment:
      SECURITY_BACKEND_OTLP_ENDPOINT: ${SECURITY_BACKEND_OTLP_ENDPOINT:?Set downstream OTLP HTTP base URL}
      SECURITY_BACKEND_AUTHORIZATION: ${SECURITY_BACKEND_AUTHORIZATION:-}
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-collector-persistent.yaml:/etc/otelcol/config.yaml:ro
      - security-collector-data:/var/lib/otelcol/security
    restart: unless-stopped
volumes:
  security-collector-data:
