[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securitycontext"
version = "0.2.5"
description = "Bounded OpenTelemetry security dataflow evidence and runtime SBOM for Python web services"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["opentelemetry-api==1.44.0", "opentelemetry-instrumentation==0.65b0", "opentelemetry-instrumentation-threading==0.65b0", "wrapt>=1.17,<3", "packaging>=24"]

[project.optional-dependencies]
fastapi = ["opentelemetry-instrumentation-fastapi==0.65b0"]
flask = ["opentelemetry-instrumentation-flask==0.65b0"]
django = ["opentelemetry-instrumentation-django==0.65b0"]
otlp = ["opentelemetry-distro==0.65b0", "opentelemetry-exporter-otlp-proto-http==1.44.0"]
test = ["pytest>=8,<10", "build>=1.2,<2", "fastapi", "pydantic>=2,<3", "flask>=3.1,<3.2", "django>=5.2,<5.3", "uvicorn", "gunicorn", "httpx", "requests", "aiohttp", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "pymysql>=1,<2", "python-multipart", "jsonschema", "psutil"]

[project.entry-points.opentelemetry_instrumentor]
securitycontext = "securitycontext:SecurityInstrumentor"

[project.entry-points.opentelemetry_pre_instrument]
securitycontext = "securitycontext:bootstrap"

[project.scripts]
securityctl = "securitycontext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
